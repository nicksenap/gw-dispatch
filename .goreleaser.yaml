version: 2

builds:
  - binary: gw-dispatch
    goos:
      - darwin
      - linux
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X github.com/nicksenap/gw-dispatch/cmd.Version={{ .Version }}

archives:
  - formats:
      - tar.gz
    name_template: "gw-dispatch_{{ .Version }}_{{ .Os }}_{{ .Arch }}"

checksum:
  name_template: checksums.txt
